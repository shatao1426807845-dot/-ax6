name: Build dogcom packages for Redmi AX6

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-dogcom-ax6.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt 24.10.7 SDK for qualcommax/ipq807x
        shell: bash
        run: |
          set -euxo pipefail
          SDK_URL="https://downloads.openwrt.org/releases/24.10.7/targets/qualcommax/ipq807x/openwrt-sdk-24.10.7-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          curl -fL --retry 3 "$SDK_URL" -o /tmp/openwrt-sdk.tar.zst
          echo "02971d61a172cc8ba7200d4251d08dfcefe37218757cf7cde07dde3b10195c3c  /tmp/openwrt-sdk.tar.zst" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar --zstd -xf /tmp/openwrt-sdk.tar.zst -C "$GITHUB_WORKSPACE/sdk" --strip-components=1

      - name: Fetch upstream dogcom projects
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/sdk"
          git clone --depth 1 https://github.com/mchome/openwrt-dogcom.git package/openwrt-dogcom
          git clone --depth 1 https://github.com/mchome/luci-app-dogcom.git package/luci-app-dogcom

      - name: Fix LuCI post-install handling for Kwrt
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("sdk/package/luci-app-dogcom")
          defaults = root / "files/root/etc/uci-defaults/40_luci-dogcom"
          defaults.write_text("""#!/bin/sh
          # Use individual UCI commands for downstream builds without reliable batch support.
          uci -q delete 'ucitrack.@dogcom[-1]' >/dev/null 2>&1 || true
          uci -q add ucitrack dogcom >/dev/null 2>&1 || true
          uci -q set 'ucitrack.@dogcom[-1].init=dogcom' >/dev/null 2>&1 || true
          uci -q commit ucitrack >/dev/null 2>&1 || true
          rm -f /tmp/luci-indexcache
          exit 0
          """)
          makefile = root / "Makefile"
          text = makefile.read_text()
          replacement = """define Package/luci-app-dogcom/postinst
          #!/bin/sh
          if [ -z "$${IPKG_INSTROOT}" ] && [ -f /etc/uci-defaults/luci-app-dogcom ]; then
          	sh /etc/uci-defaults/luci-app-dogcom || true
          	rm -f /etc/uci-defaults/luci-app-dogcom
          	rm -f /tmp/luci-indexcache
          fi
          exit 0
          endef"""
          text, count = re.subn(r"define Package/luci-app-dogcom/postinst\n.*?\nendef", replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely patch upstream LuCI postinst")
          makefile.write_text(text)
          init = root / "files/root/etc/init.d/dogcom"
          text = init.read_text()
          old = 'start(){\n    config_load dogcom\n    config_get version config version'
          new = 'start(){\n    config_load dogcom\n    config_get enabled config enabled 0\n    [ "$enabled" = "1" ] || return 0\n    config_get version config version'
          if old not in text:
              raise SystemExit("Could not find expected dogcom init start block")
          init.write_text(text.replace(old, new, 1))
          PY

      - name: Compile dogcom and LuCI package
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/sdk"
          make defconfig
          make package/openwrt-dogcom/compile -j2 V=s
          make package/luci-app-dogcom/compile -j2 V=s
          mkdir -p "$GITHUB_WORKSPACE/output"
          find bin/packages -type f \( -name 'dogcom*.ipk' -o -name 'luci-app-dogcom*.ipk' \) -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -print
          find "$GITHUB_WORKSPACE/output" -maxdepth 1 -name 'dogcom*.ipk' -print -quit | grep -q .
          find "$GITHUB_WORKSPACE/output" -maxdepth 1 -name 'luci-app-dogcom*.ipk' -print -quit | grep -q .

      - name: Validate package metadata and contents
        shell: bash
        run: |
          set -euxo pipefail
          for f in "$GITHUB_WORKSPACE"/output/*.ipk; do
            echo "=== $f ==="
            ar p "$f" control.tar.gz | tar -xzOf - ./control
          done
          ar p "$GITHUB_WORKSPACE/output/"dogcom*.ipk control.tar.gz | tar -xzOf - ./control | grep -E '^Architecture: aarch64_cortex-a53$'
          ar p "$GITHUB_WORKSPACE/output/"luci-app-dogcom*.ipk control.tar.gz | tar -xzOf - ./control | grep -E '^Architecture: all$'
          ar p "$GITHUB_WORKSPACE/output/"luci-app-dogcom*.ipk data.tar.gz | tar -tzf - | grep -q 'etc/uci-defaults/luci-app-dogcom'

      - name: Upload IPK packages
        uses: actions/upload-artifact@v4
        with:
          name: dogcom-redmi-ax6-openwrt-24.10
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 14
